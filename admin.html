<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樽TORE管理</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="樽TORE管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f6f2">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="admin-180.png">
<link rel="icon" type="image/png" href="admin-192.png">
<style>
html,body{margin:0;height:100%;background:#f7f6f2;font:15px/1.6 "Hiragino Sans","Yu Gothic",sans-serif;color:#141414}
body{display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;display:block}
.tip{display:none;align-items:center;gap:10px;background:#28308c;color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.tip img{width:36px;height:36px;border-radius:8px;flex:none}
.tip p{margin:0;flex:1;font-size:14px}
.tip button{background:none;border:0;color:#fff;font-size:22px;min-width:44px;min-height:44px;cursor:pointer}
.msg{margin:auto;padding:24px;text-align:center;max-width:360px}
.msg img{width:96px;height:96px;border-radius:22px}
</style>
</head>
<body>
<div class="tip" id="tip"><img src="admin-180.png" alt=""><p id="tipText"></p><button id="tipClose" aria-label="閉じる">×</button></div>
<script>
{
  // ▼ Apps Script のウェブアプリURL（デプロイしたURL。変わったときはここを書き換える）
  const APP = 'https://script.google.com/macros/s/AKfycbyjVXLyiuQvMKKYZI-8YnNrFRbfV_tk9JZOHkZN7MtK6GZmUMKzWf5Uesb_xCafgss/exec';
  const NAME = '樽TORE管理', ICON = 'admin';
  const key = decodeURIComponent(location.hash.slice(1));
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;

  if (!key) {
    document.body.insertAdjacentHTML('beforeend', '<div class="msg"><img src="' + ICON + '-180.png" alt=""><p>管理画面のURLは、スプレッドシートの「設定」シートにあります。</p></div>');
  } else {
    const f = document.createElement('iframe');
    f.src = APP + '?admin=' + encodeURIComponent(key);
    f.title = NAME;
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
    // Android（Chrome）でホーム画面に追加したとき、全画面で開けるようにする
    if (!ios) {
      const base = location.href.replace(/[^/]*([?#].*)?$/, '');
      const m = {
        name: NAME, short_name: NAME, start_url: location.href, scope: base, display: 'standalone',
        background_color: '#f7f6f2', theme_color: '#f7f6f2',
        icons: [192, 512].map(s => ({ src: base + ICON + '-' + s + '.png', sizes: s + 'x' + s, type: 'image/png' })),
      };
      const l = document.createElement('link');
      l.rel = 'manifest';
      l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
      document.head.appendChild(l);
    }
    // まだホーム画面に追加していない人へのひとこと案内
    let hide = false;
    try { hide = localStorage.getItem('tipClosedAdmin') === '1'; } catch (e) { }
    if (!standalone && !hide) {
      document.getElementById('tipText').textContent = ios
        ? '下の共有ボタン（□↑）→「ホーム画面に追加」で、アプリのように使えます'
        : '右上の︙ →「ホーム画面に追加」で、アプリのように使えます';
      document.getElementById('tip').style.display = 'flex';
      document.getElementById('tipClose').onclick = () => {
        document.getElementById('tip').style.display = 'none';
        try { localStorage.setItem('tipClosedAdmin', '1'); } catch (e) { }
      };
    }
  }
}
</script>
</body>
</html>
